## approve-merge.yml — Human-only merge approval
#
# Updates the "merge-gate" check run to success for a specific PR.
# Requires MERGE_PASSPHRASE from GitHub Secrets — Claude Code cannot
# read GitHub Secrets (gh secret list shows names, not values).
#
# Usage (from terminal, NOT from Claude Code):
#   gh workflow run approve-merge.yml -f pr=31 -f passphrase=<your-passphrase>
#
# Or from GitHub Actions UI: Actions > Approve Merge > Run workflow

name: Approve Merge

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to approve for merge'
        required: true
      passphrase:
        description: 'Approval passphrase (from GitHub Secrets)'
        required: true

permissions:
  checks: write
  pull-requests: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Verify passphrase
        env:
          INPUT_PASSPHRASE: ${{ github.event.inputs.passphrase }}
          MERGE_PASSPHRASE: ${{ secrets.MERGE_PASSPHRASE }}
        run: |
          if [ -z "$MERGE_PASSPHRASE" ]; then
            echo "::error::MERGE_PASSPHRASE secret is not set. Set it in repo Settings > Secrets."
            exit 1
          fi
          if [ "$INPUT_PASSPHRASE" != "$MERGE_PASSPHRASE" ]; then
            echo "::error::Invalid passphrase. Merge approval denied."
            exit 1
          fi
          echo "Passphrase verified."

      - name: Set merge-gate to success
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER);
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Find the most recent merge-gate check run
            const checkRuns = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.data.head.sha,
              check_name: 'merge-gate'
            });
            const mergeGate = checkRuns.data.check_runs
              .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];

            if (!mergeGate) {
              core.setFailed(`No merge-gate check run found for PR #${prNumber}`);
              return;
            }

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: mergeGate.id,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: `Human approved PR #${prNumber}`,
                summary: `Approved by workflow_dispatch at ${new Date().toISOString()}`
              }
            });
            console.log(`merge-gate set to success for PR #${prNumber} (check run ID: ${mergeGate.id})`);

      - name: Post approval comment on PR
        env:
          PR_NUMBER: ${{ github.event.inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=${{ github.run_id }}
          gh pr comment "$PR_NUMBER" --body "**jkz:merge-gate** — Approved by workflow run [#${RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID})"
